<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safari Tracking Protection Test</title>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 20px;
    max-width: 1100px;
}
table {
    border-collapse: collapse;
    width: 100%;
}
th, td {
    border: 1px solid #ddd;
    padding: 8px;
    vertical-align: top;
}
.pass { background: #d4edda; }
.allowed { background: #fff3cd; }
.fail { background: #f8d7da; }
.summary {
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    background: #f5f5f5;
}
.small { font-size: 12px; color: #666; }
code { font-size: 12px; }
</style>
</head>
<body>

<h1>Safari Tracking Protection Test</h1>

<div class="summary" id="summary">Running tests…</div>
<div id="env"></div>

<table>
<thead>
<tr>
<th>Test</th>
<th>Verdict</th>
<th>Details</th>
</tr>
</thead>
<tbody id="results"></tbody>
</table>

<script>
/**
 * Distinguishes outcomes that the old Image()-only harness collapsed into FAIL:
 *   LOADED        – image decoded (pixel or real asset arrived)
 *   ALLOWED_EMPTY – HTTP completed (e.g. 204 / empty body); domain was NOT network-blocked
 *   HTTP_ERROR    – 4xx/5xx from the server
 *   LIKELY_BLOCKED– load failed with no useful HTTP status (typical of Private Browsing ATF list block)
 *
 * Known-tracker *network* blocking is on by default in Private Browsing only.
 * In a normal window you should usually see LOADED or ALLOWED_EMPTY for Dotomi, not LIKELY_BLOCKED.
 */

const tests = [
    {
        name: "Google Control",
        url: "https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png",
        kind: "control"
    },
    {
        name: "TradeDesk Corporate",
        url: "https://www.thetradedesk.com/assets/general/_1900xAUTO_fit_center-center_75/man-glasses-desktop.jpg",
        kind: "control"
    },
    // --- iOS 27 “8 club” hard-block set (plus Dotomi for comparison) ---
    {
        name: "8-club · adsrvr.org (TTD match)",
        url: "https://match.adsrvr.org/track/cmf/generic?ttd_pid=6szhitj&ttd_tpi=1&gdpr_consent=GDPR_CONSENT",
        kind: "club8"
    },
    {
        name: "8-club · uidapi.com (UID2 SDK JS)",
        url: "https://cdn.prod.uidapi.com/uid2-sdk-4.0.1.js",
        kind: "club8"
    },
    {
        name: "8-club · id5-sync.com (sync GIF)",
        url: "https://id5-sync.com/s/99999/0.gif",
        kind: "club8"
    },
    {
        name: "8-club · eu-1-id5-sync.com (sync GIF)",
        url: "https://eu-1-id5-sync.com/s/99999/0.gif",
        kind: "club8"
    },
    {
        name: "8-club · rlcdn.com (LiveRamp pixel)",
        url: "https://id.rlcdn.com/1000.gif",
        kind: "club8"
    },
    {
        name: "8-club · pippio.com (LiveRamp sync)",
        url: "https://pippio.com/api/sync",
        kind: "club8"
    },
    {
        name: "8-club · permutive.com (px sync)",
        url: "https://googlesync.permutive.com/v2.0/px/sync",
        kind: "club8"
    },
    {
        name: "8-club · ad.gt (Audigent match)",
        url: "https://ids.ad.gt/api/v1/match",
        kind: "club8"
    },
    {
        name: "Epsilon / Dotomi Match (not 8-club)",
        url: "https://login.dotomi.com/match/bounce/current?networkId=41440&version=1&nuid=STABLE_USER_TOKEN&gdpr_consent=GDPR_CONSENT",
        kind: "match"
    }
];

const counts = {
    LOADED: 0,
    ALLOWED_EMPTY: 0,
    HTTP_ERROR: 0,
    LIKELY_BLOCKED: 0
};

const results = document.getElementById("results");

document.getElementById("env").innerHTML = `
<p class="small">${navigator.userAgent}</p>
<p class="small">
Compare <b>normal</b> vs <b>Private Browsing</b> windows.
ATF known-tracker network blocking is default-on in Private Browsing;
enable “Use advanced tracking and fingerprinting protection” for all browsing to test it in normal windows.
</p>
<p class="small">
Rows marked <code>8-club</code> are the iOS 27 hard-block set reported for ATF
(adsrvr.org, uidapi.com, id5-sync.com, eu-1-id5-sync.com, rlcdn.com, pippio.com, permutive.com, ad.gt).
Probe URLs are high-prevalence Tracker Radar resources; some return non-image bodies
(ALLOWED_EMPTY when allowed, LIKELY_BLOCKED when list-blocked).
</p>`;

function classifyRow(verdict) {
    if (verdict === "LOADED") return "pass";
    if (verdict === "ALLOWED_EMPTY") return "allowed";
    return "fail";
}

function addResult(name, verdict, detail) {
    counts[verdict] = (counts[verdict] || 0) + 1;
    const tr = document.createElement("tr");
    tr.className = classifyRow(verdict);
    tr.innerHTML = `
        <td>${name}</td>
        <td><b>${verdict}</b></td>
        <td>${detail}</td>`;
    results.appendChild(tr);
    updateSummary();
}

function updateSummary() {
    document.getElementById("summary").innerHTML = `
        <b>Loaded:</b> ${counts.LOADED}
        &nbsp;|&nbsp; <b>Allowed (empty/non-image):</b> ${counts.ALLOWED_EMPTY}
        &nbsp;|&nbsp; <b>HTTP error:</b> ${counts.HTTP_ERROR}
        &nbsp;|&nbsp; <b>Likely blocked:</b> ${counts.LIKELY_BLOCKED}
        <br><br>
        <b>How to read this</b><br>
        <code>LOADED</code> — request allowed; image body decoded.<br>
        <code>ALLOWED_EMPTY</code> — request reached the network (e.g. Dotomi 302→204);
        the domain was <em>not</em> list-blocked. Safari often hides cross-origin
        HTTP status; redirects/duration in Resource Timing are used instead.<br>
        <code>HTTP_ERROR</code> — server returned 4xx/5xx (when status is visible).<br>
        <code>LIKELY_BLOCKED</code> — image error with no completed Resource Timing
        (typical Private Browsing ATF tracker block). Check Web Inspector for
        “Blocked connection to known tracker”.
    `;
}

function resourceTimingFor(url) {
    const exact = performance.getEntriesByName(url, "resource");
    if (exact.length)
        return exact[exact.length - 1];

    // Redirect hops may appear under the final URL (e.g. …&DotomiTest=…).
    const hostPath = (() => {
        try {
            const u = new URL(url);
            return u.origin + u.pathname;
        } catch {
            return url;
        }
    })();

    const related = performance.getEntriesByType("resource")
        .filter((e) => typeof e.name === "string" && e.name.startsWith(hostPath));
    return related.length ? related[related.length - 1] : null;
}

function networkCompleted(entry) {
    if (!entry)
        return false;
    // Cross-origin entries often zero sizes/status (no Timing-Allow-Origin),
    // but duration / redirects still prove the request left the device.
    if (entry.redirectCount > 0)
        return true;
    if (entry.duration > 0)
        return true;
    if (entry.responseEnd > entry.startTime)
        return true;
    return false;
}

function verdictFrom(imgResult, entry, ms) {
    const status = entry && typeof entry.responseStatus === "number" && entry.responseStatus > 0
        ? entry.responseStatus
        : null;
    const encoded = entry ? entry.encodedBodySize : null;
    const transfer = entry ? entry.transferSize : null;
    const redirects = entry ? entry.redirectCount : null;
    const duration = entry ? Math.round(entry.duration) : null;
    const timing = entry
        ? `timing status=${status ?? "n/a"}, redirects=${redirects}, duration=${duration}ms, encoded=${encoded}, transfer=${transfer}, ${ms}ms`
        : `no resource timing, ${ms}ms`;

    if (imgResult.ok && imgResult.w > 0 && imgResult.h > 0) {
        return {
            verdict: "LOADED",
            detail: `Decoded ${imgResult.w}×${imgResult.h}; ${timing}`
        };
    }

    // Explicit HTTP status when Safari exposes it (same-origin or TAO).
    if (status !== null && status >= 200 && status < 400) {
        return {
            verdict: "ALLOWED_EMPTY",
            detail: `HTTP ${status} with no image body — network allowed, not an ATF domain block. ${timing}`
        };
    }

    if (status !== null && status >= 400) {
        return {
            verdict: "HTTP_ERROR",
            detail: `HTTP ${status}. ${timing}`
        };
    }

    // Safari cross-origin: status/sizes are usually hidden. If timing shows the
    // load completed (e.g. Dotomi 302→204), that is ALLOWED_EMPTY — not blocked.
    if (!imgResult.ok && networkCompleted(entry)) {
        return {
            verdict: "ALLOWED_EMPTY",
            detail: `Image failed to decode but network completed (often HTTP 204 after redirect) — not an ATF domain block. ${timing}`
        };
    }

    // No usable timing → request likely cancelled before the network (ATF / content blocker).
    return {
        verdict: "LIKELY_BLOCKED",
        detail: `Image error with no completed resource timing — likely content-blocker / ATF. ${timing}`
    };
}

function runTest(test) {
    const url = test.url + (test.url.includes("?") ? "&" : "?") + "cb=" + Date.now();
    const start = performance.now();

    return new Promise((resolve) => {
        const img = new Image();
        const finish = (imgResult) => {
            // Resource Timing is populated after the load settles.
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const ms = Math.round(performance.now() - start);
                    const entry = resourceTimingFor(url);
                    const { verdict, detail } = verdictFrom(imgResult, entry, ms);
                    addResult(test.name, verdict, detail);
                    resolve();
                }, 50);
            });
        };

        img.onload = () => finish({
            ok: true,
            w: img.naturalWidth,
            h: img.naturalHeight
        });
        img.onerror = () => finish({ ok: false, w: 0, h: 0 });
        img.src = url;
    });
}

(async () => {
    for (const test of tests)
        await runTest(test);
})();
</script>

</body>
</html>
