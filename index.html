<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Safari TTD Test</title>

<style>
body {
    font-family: -apple-system,BlinkMacSystemFont,sans-serif;
    margin: 20px;
    max-width: 1000px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
}

.pass {
    background: #d4edda;
}

.fail {
    background: #f8d7da;
}

.pending {
    background: #fff3cd;
}

.summary {
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    background: #f5f5f5;
}

.small {
    font-size: 12px;
    color: #666;
}

img.testimg {
    max-width: 120px;
    max-height: 60px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<h1>Safari Tracking Protection Test</h1>

<div class="summary" id="summary">
Running tests...
</div>

<div id="env"></div>

<table>
<thead>
<tr>
<th>Test</th>
<th>Status</th>
<th>Details</th>
</tr>
</thead>
<tbody id="results"></tbody>
</table>

<script>

const tests = [

{
    name: "Google Control",
    url: "https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png"
},

{
    name: "TradeDesk Corporate",
    url: "https://www.thetradedesk.com/assets/general/_1900xAUTO_fit_center-center_75/man-glasses-desktop.jpg"
},

{
    name: "TTD Match Pixel",
    url: "https://match.adsrvr.org/track/cmf/generic?ttd_pid=6szhitj&ttd_tpi=1&gdpr_consent=GDPR_CONSENT"
}

];

const results =
document.getElementById("results");

let passCount = 0;
let failCount = 0;

function addResult(name,status,detail){

    const tr =
    document.createElement("tr");

    tr.className =
        status === "PASS"
        ? "pass"
        : "fail";

    tr.innerHTML = `
        <td>${name}</td>
        <td><b>${status}</b></td>
        <td>${detail}</td>
    `;

    results.appendChild(tr);

    if(status==="PASS"){
        passCount++;
    }else{
        failCount++;
    }

    updateSummary();
}

function updateSummary(){

    document.getElementById("summary").innerHTML = `
        ✅ Pass: ${passCount}<br>
        ❌ Fail: ${failCount}<br>
        <br>
        <b>What matters most:</b><br>
        If "TTD Match Pixel" fails while Google succeeds,
        Safari is likely treating adsrvr.org differently.
    `;
}

document.getElementById("env").innerHTML =
`
<p class="small">
${navigator.userAgent}
</p>
`;

function imageTest(test){

    const start = performance.now();

    const img =
    new Image();

    img.onload = function() {

        addResult(
            test.name,
            "PASS",
            `Loaded in ${Math.round(performance.now() - start)} ms
            (${img.naturalWidth} × ${img.naturalHeight})`
        );

    };

    img.onerror = function() {

        addResult(
            test.name,
            "FAIL",
            "Image load failed"
        );

    };

    img.src =
      test.url +
      (test.url.includes("?") ? "&" : "?") +
      "cb=" +
      Date.now();
}

tests.forEach(imageTest);

</script>

</body>
</html>
